[package]
name = "cibo"
version = "0.1.0"
description = "Cibo — cross-platform habit tracker"
authors = ["McKirity"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cibo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] } # tray-icon: step 7's minimized-only timer tray
tauri-plugin-opener = "2"
# The whimsy network tier (weather · horoscope) — all fetches run Rust-side;
# the webview never talks to the network (Importer Runtime & External Access).
tauri-plugin-http = "2"
# The theme loader (step 6a) — fs reads the two theme roots (bundled resources +
# the drop-in folder); dialog picks the drop-in root (its picks extend the fs
# scope at runtime); persisted-scope keeps that grant across restarts.
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-persisted-scope = "2"
# Single instance (ruled in App Lifecycle & OS Integration; built at the
# Phase-2 completion audit, 2026-08-06 — it was ruled but never wired): two
# processes would be two writers on one SQLite/local-store, never allowed.
tauri-plugin-single-instance = "2"
# Auto-update (Phase 2 step 5) — silent, launch-check, install-on-quit,
# stable-only, no rollback ([[Auto-Update]]). Endpoint + pubkey live in
# tauri.conf.json; the fetch runs Rust-side, so the webview CSP is untouched.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Calibre importer (step 8) — read-only reads of the user's Calibre
# metadata.db, a second SQLite entirely separate from Evolu; never writes
# (Importer Runtime & External Access § the Calibre reader). `bundled` so the
# build never depends on a system sqlite.
rusqlite = { version = "0.32", features = ["bundled"] }
# Backups (step 12) — every artifact is compressed at write time (zstd, the
# ruled codec) and the store-directory copy travels as a tar; the growth
# spike's sizing amendment is why compression is not optional.
zstd = "0.13"
tar = "0.4"

# Compression must never run unoptimized: at opt-level 0 a close-time backup
# of the spike-inflated dev store ground for MINUTES and read as a hang
# (found live 2026-08-03). Dev builds compile just the zstd stack optimized.
[profile.dev.package.zstd]
opt-level = 3
[profile.dev.package.zstd-safe]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3

